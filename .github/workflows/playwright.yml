name: Playwright Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    name: Run Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm test
        env:
          GUARD_EMAIL: ${{ secrets.GUARD_EMAIL || 'guard1@security.com' }}
          GUARD_PASSWORD: ${{ secrets.GUARD_PASSWORD || 'password123' }}
          SUPERVISOR_EMAIL: ${{ secrets.SUPERVISOR_EMAIL || 'supervisor@security.com' }}
          SUPERVISOR_PASSWORD: ${{ secrets.SUPERVISOR_PASSWORD || 'password123' }}
          BACKEND_URL: ${{ secrets.BACKEND_URL || 'https://security-patrol-backend.onrender.com' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30
